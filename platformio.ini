; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    https://github.com/goBILDA-Official/goBILDA-Pinpoint-Arduino-Library.git

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; VL6180X ToF bench test - builds esp32_tof/ only (its own main.cpp)
[env:xiao_tof]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps = pololu/VL6180X
build_src_filter = -<*> +<../esp32_tof/src/>
build_flags = -I esp32_tof/include
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
